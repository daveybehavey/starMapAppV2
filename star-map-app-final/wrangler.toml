[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "star-map-final"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "cache"

[[kv_namespaces]]
binding = "STAR_MAP_KV"
id = "cdef6c5fa5cc4e52bfe105aa1ba37713"

# Thin per-logical-order SQLite DO: bind + terminal failure + operator recover only.
# Does not provision resources until an approved deploy; local/CI use in-memory fallback.
[[durable_objects.bindings]]
name = "PRINT_ORDER_AUTHORITY"
class_name = "PrintOrderAuthorityDO"

[[migrations]]
tag = "v1-print-order-authority"
new_sqlite_classes = ["PrintOrderAuthorityDO"]

# Per-session review-request ledger (claim/send state machine). DO bindings
# are not text bindings and do not count toward the 128 text-binding cap.
[[durable_objects.bindings]]
name = "REVIEW_REQUEST_LEDGER"
class_name = "ReviewRequestLedgerDO"

[[migrations]]
tag = "v2-review-request-ledger"
new_sqlite_classes = ["ReviewRequestLedgerDO"]

# Per-entitlement DL-1 entitlement authority (owned-files ledger, legacy
# recovery decision, capability generation, referral reward bucket).
# Slice 3: the legacy consume/compensate routes hold its accounting lease
# and refuse migrated entitlements; the Stripe webhook CAN route referral
# grants/reversals through it, but that routing stays GATED OFF until the
# owner sets DL1_AUTHORITY_ROUTING_ENABLED=true in the dashboard at the
# Slice 6 cutover (when downloads gain an authority debit path) —
# deliberately NOT a [vars] entry here, so activation is an explicit
# owner action rather than a deploy side effect.
[[durable_objects.bindings]]
name = "ENTITLEMENT_AUTHORITY"
class_name = "EntitlementAuthorityDO"

[[migrations]]
tag = "v3-entitlement-authority"
new_sqlite_classes = ["EntitlementAuthorityDO"]

# Per-recipient review-request suppression record + dispatch coordinator
# (T-T1 revised design). The coordinator is the only component that may
# call the email provider for a review request. INERT in practice until
# the engine's own activation gates pass — the binding existing changes
# nothing while REVIEW_REQUESTS_ENABLED is unset.
[[durable_objects.bindings]]
name = "REVIEW_REQUEST_SUPPRESSION"
class_name = "ReviewRequestSuppressionDO"

[[migrations]]
tag = "v4-review-request-suppression"
new_sqlite_classes = ["ReviewRequestSuppressionDO"]

# DL-1 referral discovery authority (v3.8 §5.2): one instance per referred
# checkout session id; registration inside the grant op precedes any fold
# effect, and terminal negative lineage decisions are recorded here
# before dedupe finalizes (v3.9 §4). Like the entitlement authority it is
# inert until the owner activates D1 routing — no [vars] entry.
[[durable_objects.bindings]]
name = "REFERRAL_DISCOVERY"
class_name = "ReferralDiscoveryDO"

[[migrations]]
tag = "v4-referral-discovery"
new_sqlite_classes = ["ReferralDiscoveryDO"]

# Consistency Coordinator (T-SM-KVRACE): per-token / per-email authority
# for the magic-token claim, the account email session index, and
# promotions subscription + delivery jobs — three KV check-then-write
# races (A2-1/A2-2/A2-3) that KV itself cannot close. One object per
# token/email; legacy KV state imports lazily and monotonically.
[[durable_objects.bindings]]
name = "CONSISTENCY_COORDINATOR"
class_name = "ConsistencyCoordinatorDO"

[[migrations]]
tag = "v5-consistency-coordinator"
new_sqlite_classes = ["ConsistencyCoordinatorDO"]

# Persist Worker console logs in Cloudflare dashboard (Workers Logs).
# Logging in checkout is structured and excludes PII/secrets; see checkoutResilience.ts.
[observability]
enabled = true
head_sampling_rate = 1

[images]
binding = "IMAGES"
