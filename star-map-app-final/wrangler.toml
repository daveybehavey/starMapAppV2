name = "star-map-final"
account_id = "c5699cbcedce27a6ad755bdeb815f6de"
# Custom entry re-exports OpenNext fetch handler + PrintOrderAuthorityDO.
# See https://opennext.js.org/cloudflare/howtos/custom-worker
main = "cloudflare-worker.ts"
compatibility_date = "2025-12-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "starmapco.com/*", zone_name = "starmapco.com" },
  { pattern = "www.starmapco.com/*", zone_name = "starmapco.com" },
  { pattern = "starmapco.ca/*", zone_name = "starmapco.ca" },
  { pattern = "www.starmapco.ca/*", zone_name = "starmapco.ca" },
]

# Review-request engine (T1): 15-minute tick drives the scheduled handler in
# cloudflare-worker.ts. The engine is INERT unless REVIEW_REQUESTS_ENABLED is
# set to "true" in the dashboard at activation time — deliberately NOT a
# [vars] entry (binding budget, and activation must stay an explicit owner
# action rather than a code deploy).
[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
