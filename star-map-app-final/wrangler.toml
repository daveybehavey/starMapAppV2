name = "star-map-final"
account_id = "c5699cbcedce27a6ad755bdeb815f6de"
# Custom entry re-exports OpenNext fetch handler + PrintOrderAuthorityDO.
# See https://opennext.js.org/cloudflare/howtos/custom-worker
main = "cloudflare-worker.ts"
compatibility_date = "2025-12-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "starmapco.com/*", zone_name = "starmapco.com" },
  { pattern = "www.starmapco.com/*", zone_name = "starmapco.com" },
  { pattern = "starmapco.ca/*", zone_name = "starmapco.ca" },
  { pattern = "www.starmapco.ca/*", zone_name = "starmapco.ca" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTJS_ENV = "production"

# Site Configuration
NEXT_PUBLIC_SITE_URL = "https://starmapco.com"

# Feature flags
BULK_EVENT_ORDERS_ENABLED = "true"

# Analytics (NEXT_PUBLIC_POSTHOG_KEY: .env.local locally, GitHub secret in CI — not committed)
NEXT_PUBLIC_POSTHOG_HOST = "https://app.posthog.com"
NEXT_PUBLIC_GA_ID = "G-N4PPJ50JQ7"
NEXT_PUBLIC_GA4_SERVER_PURCHASES = "true"
NEXT_PUBLIC_GTM_ID = "GTM-55ZSX47J"
NEXT_PUBLIC_PINTEREST_TAG_ID = "2613937502043"

# Pricing Configuration
PRICE_CENTS = "900"
PROMO_PRICE_CENTS = ""
PROMO_START = "2026-01-01"
PROMO_END = "2026-01-31T23:59:59-05:00"
CURRENCY = "usd"
PROMOTION_COUPON_CODE = "FIRST50"
PROMOTION_COUPON_PERCENT = "50"
PROMOTION_TARGET_SCOPE = "single_digital"
PROMOTION_TARGET_LABEL = "your first single HD digital checkout"
PROMOTION_OFFER_NAME = "HD starter code"
NEXT_PUBLIC_PROMOTION_TARGET_SCOPE = "single_digital"
NEXT_PUBLIC_PROMOTION_TARGET_LABEL = "your first single HD digital checkout"
NEXT_PUBLIC_PROMOTION_OFFER_NAME = "HD starter code"
REFERRAL_MAX_REWARDS_PER_REFERRER_24H = "3"
REFERRAL_MAX_REWARDS_PER_REFERRER_30D = "10"
STRIPE_PROMO_CODE_ID = "promo_1T9yiqLWqD0o9865TDqasALZ"
STRIPE_PRICE_ID_SINGLE = "price_1SuO9jLWqD0o9865oJRZZlCL"
STRIPE_PRICE_ID_PACK3 = "price_1SuOJMLWqD0o9865vhXRX5C3"
STRIPE_PRICE_ID_SUBSCRIPTION = "price_1SuOJMLWqD0o98656BWDtTmt"
STRIPE_PAYMENT_METHOD_CONFIGURATION_ID = "pmc_1TBlq4LWqD0o98657GwX3SZM"

# Print checkout (feature-gated; keep disabled until fulfillment is verified)
PRINT_CHECKOUT_ENABLED = "true"
NEXT_PUBLIC_PRINT_CHECKOUT_ENABLED = "true"
# Optional merch landing + nav tab (/shop). Uses roadmap SKUs + NEXT_PUBLIC_SHOP_EXTERNAL_OFFERS_JSON for partner links.
NEXT_PUBLIC_SHOP_TAB_ENABLED = "true"
PRINT_UNFRAMED_LABEL = "Museum-grade poster (18x18)"
PRINT_FRAMED_LABEL = "Framed print (14x14)"
# Leave empty to use all countries currently present in data/printful-shipping.json
PRINT_ALLOWED_COUNTRIES = ""
NEXT_PUBLIC_PRINT_ALLOWED_COUNTRIES = ""
# Merchant feed can stay narrower than checkout countries when local business or currency rules apply.
MERCHANT_FEED_COUNTRIES = "US,CA,GB,IE,AU,NZ"
PRINT_STANDARD_SHIPPING_CENTS = "1399"
PRINT_STANDARD_SHIPPING_LABEL = "Standard U.S. shipping"
PRINT_STANDARD_SHIPPING_MIN_BUSINESS_DAYS = "3"
PRINT_STANDARD_SHIPPING_MAX_BUSINESS_DAYS = "4"
PRINT_DYNAMIC_SHIPPING = "true"
PRINT_MARGIN_GUARD_ENABLED = "true"
PRINT_MIN_MARGIN_CENTS = "1000"
PRINT_ORDER_SUBMISSION_ENABLED = "true"
PRINTFUL_STORE_ID = "17779767"
PRINTFUL_VARIANT_ID_POSTER_UNFRAMED = "6242"
PRINTFUL_VARIANT_ID_POSTER_FRAMED = "4654"
# Pilot SKUs — Stripe Price IDs optional; checkout falls back to price_data when unset
PRINTFUL_VARIANT_ID_CANVAS_WRAP = "19291"
PRINTFUL_VARIANT_ID_MUG_11OZ = "9323"
PRINTFUL_VARIANT_ID_CARD_4X6 = "14457"
STRIPE_PRICE_ID_PRINT_CARD_4X6 = "price_1ThdfMLWqD0o9865Z3DQ6AcW"

# Geo-priced digital single map (staged; turn on after pricing review)
# Flag + min-cents are code defaults in src/lib/geoPricing.ts (disabled, 300);
# re-add GEO_DIGITAL_SINGLE_PRICING_ENABLED here to enable.
GEO_DIGITAL_SINGLE_PRICING_JSON = "{\"IN\":500,\"PH\":550,\"ID\":600,\"VN\":600,\"BD\":500,\"NG\":600,\"KE\":650,\"GH\":650,\"PK\":550,\"LK\":550,\"NP\":500,\"MX\":700,\"BR\":700,\"CO\":700,\"PE\":700}"

# Client-side Accessible Pricing
NEXT_PUBLIC_PRICE_CENTS = "900"
NEXT_PUBLIC_PROMO_PRICE_CENTS = ""
NEXT_PUBLIC_PROMO_START = "2026-01-01"
NEXT_PUBLIC_PROMO_END = "2026-01-31T23:59:59-05:00"
NEXT_PUBLIC_CURRENCY = "usd"
NEXT_PUBLIC_PRINT_UNFRAMED_LABEL = "Museum-grade poster (18x18)"
NEXT_PUBLIC_PRINT_FRAMED_LABEL = "Framed print (14x14)"
# Binding budget: Cloudflare caps a Worker at 128 text bindings. Price/label/COGS
# vars that merely restated code defaults were removed 2026-10-18 — the defaults
# live in src/lib/pricing.ts, src/lib/printCatalog.ts and src/lib/merchCatalog.ts.
# Only flags / non-default values / IDs belong in [vars].
# Merch beta — stickers first; magnets/pins/tee/hoodie enabled 2026-10-18 (owner-approved).
# Families without a STRIPE_PRICE_ID_* line intentionally use the price_data fallback
# (catalog priceFallbackCents) — no Stripe price ids exist for them yet.
NEXT_PUBLIC_MERCH_BETA_ENABLED = "true"
NEXT_PUBLIC_MERCH_STICKERS_ENABLED = "true"
STRIPE_PRICE_ID_MERCH_STICKERS = "price_1TheO4LWqD0o9865V4Bg2V7z"
NEXT_PUBLIC_MERCH_MAGNETS_ENABLED = "true"
NEXT_PUBLIC_MERCH_PINS_ENABLED = "true"
NEXT_PUBLIC_MERCH_PINS_LABEL = "Pin buttons"
NEXT_PUBLIC_MERCH_TEE_ENABLED = "true"
NEXT_PUBLIC_MERCH_HOODIE_ENABLED = "true"
NEXT_PUBLIC_REFERRAL_FRIEND_OFFER_LABEL = "a free HD download"

# Download archive (stores the exact PNG in R2 after download)
NEXT_PUBLIC_DOWNLOAD_ARCHIVE_ENABLED = "true"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "star-map-final"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "cache"

[[kv_namespaces]]
binding = "STAR_MAP_KV"
id = "cdef6c5fa5cc4e52bfe105aa1ba37713"

# Thin per-logical-order SQLite DO: bind + terminal failure + operator recover only.
# Does not provision resources until an approved deploy; local/CI use in-memory fallback.
[[durable_objects.bindings]]
name = "PRINT_ORDER_AUTHORITY"
class_name = "PrintOrderAuthorityDO"

[[migrations]]
tag = "v1-print-order-authority"
new_sqlite_classes = ["PrintOrderAuthorityDO"]

# Persist Worker console logs in Cloudflare dashboard (Workers Logs).
# Logging in checkout is structured and excludes PII/secrets; see checkoutResilience.ts.
[observability]
enabled = true
head_sampling_rate = 1

[images]
binding = "IMAGES"
