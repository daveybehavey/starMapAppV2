name = "star-map-final"
account_id = "c5699cbcedce27a6ad755bdeb815f6de"
main = ".open-next/worker.js"
compatibility_date = "2025-12-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "starmapco.com/*", zone_name = "starmapco.com" },
  { pattern = "www.starmapco.com/*", zone_name = "starmapco.com" },
  { pattern = "starmapco.ca/*", zone_name = "starmapco.ca" },
  { pattern = "www.starmapco.ca/*", zone_name = "starmapco.ca" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTJS_ENV = "production"
NEXT_INC_CACHE_R2_PREFIX = "incremental-cache"

# Site Configuration
NEXT_PUBLIC_SITE_URL = "https://starmapco.com"

# Feature flags
BULK_EVENT_ORDERS_ENABLED = "true"

# Analytics (NEXT_PUBLIC_POSTHOG_KEY: .env.local locally, GitHub secret in CI — not committed)
NEXT_PUBLIC_POSTHOG_HOST = "https://app.posthog.com"
NEXT_PUBLIC_GA_ID = "G-N4PPJ50JQ7"
NEXT_PUBLIC_GA4_SERVER_PURCHASES = "true"
