<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Star Map Generator — Create Your Personalized Star Map</title>
    <meta name="description" content="Create a beautiful, personalized star map for any date and place. Perfect as a gift or keepsake. Start for free and preview your design instantly." />
    <style>
      :root {
        --bg: #071026;
        --card: #0b1a2b;
        --accent: #ffd166;
        --muted: #9fb0c8;
        --white: #ffffff;
      }
      html, body {
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      body {
        background: linear-gradient(180deg, var(--bg), #02101a);
        color: var(--white);
        -webkit-font-smoothing: antialiased;
      }
      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 28px;
      }
      .hero {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .hero .left {
        flex: 1;
      }
      .hero h1 {
        font-size: 2.2rem;
        margin: 0 0 10px;
        line-height: 1.05;
      }
      .hero p {
        color: var(--muted);
        margin: 0 0 18px;
      }
      .cta-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        padding: 12px 18px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(90deg, var(--accent), #ffb457);
        color: #06121a;
        box-shadow: 0 6px 20px rgba(255, 177, 87, 0.12);
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--white);
      }
      .small-note {
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 10px;
      }
      .preview {
        width: 320px;
        min-width: 240px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
        padding: 16px;
        box-shadow: 0 8px 30px rgba(2, 8, 23, 0.6);
      }
      .preview .map {
        height: 220px;
        border-radius: 8px;
        background: radial-gradient(circle at 30% 20%, rgba(255, 209, 102, 0.06), rgba(255, 255, 255, 0.02) 30%, transparent 60%), linear-gradient(180deg, #041321, #02101a);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .benefits {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .benefit {
        flex: 1;
        min-width: 160px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent);
        padding: 12px;
        border-radius: 10px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .email-capture {
        margin-top: 18px;
        background: var(--card);
        padding: 12px;
        border-radius: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .email-capture input[type="email"] {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: transparent;
        color: var(--white);
        outline: none;
      }
      .email-capture button {
        padding: 10px 14px;
        border-radius: 8px;
        border: 0;
        background: var(--accent);
        color: #06121a;
        font-weight: 700;
        cursor: pointer;
      }
      footer {
        margin-top: 36px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      @media (max-width: 820px) {
        .hero {
          flex-direction: column-reverse;
        }
        .preview {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="container" role="main">
      <section class="hero" aria-labelledby="page-title">
        <div class="left">
          <h1 id="page-title">Create your personalized star map — made for moments that matter</h1>
          <p>Turn a date, time, and place into a beautiful, printable star map. Preview instantly, customize colors & text, and get free delivery options.</p>

          <div class="cta-row" role="navigation" aria-label="primary calls to action">
