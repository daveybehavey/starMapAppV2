<!doctype html>
<html lang="en">
<head>

  <title>Constellation Creator — Starmap Co.</title>

  <style>
    :root {
      --bg: #0b1220;
      --card: #071021;
      --accent: #ffd166;
      --muted: #9aa7b2;
      --white: #ffffff;
      --max-width: 980px;
    }
    html,body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #020617 0%, #071226 50%, #051220 100%);
      color: var(--white);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .container {
      max-width: var(--max-width);
      margin: 48px auto;
      padding: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: 12px;
      box-shadow: 0 6px 30px rgba(2,6,23,0.7);
    }
    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 24px;
      margin-bottom: 18px;
    }
    .branding {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo {
      width:48px;
      height:48px;
      border-radius:8px;
      background: radial-gradient(circle at 30% 30%, var(--accent), #ff9f1c 40%, #7fbfff 100%);
      box-shadow: 0 4px 18px rgba(0,0,0,0.6), inset 0 -6px 20px rgba(0,0,0,0.15);
    }
    h1 {
      margin:0;
      font-size: 28px;
      line-height:1.05;
    }
    p.lead {
      margin: 8px 0 0 0;
      color: var(--muted);
      font-size: 15px;
    }
    .hero {
      display:flex;
      gap: 28px;
      align-items:center;
      margin-top: 18px;
      flex-wrap:wrap;
    }
    .left {
      flex: 1 1 420px;
      min-width: 260px;
    }
    .right {
      width: 320px;
      min-width: 260px;
    }
    .features {
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:16px;
    }
    .feature {
      display:flex;
      gap:12px;
      align-items:flex-start;
      color:var(--muted);
      font-size:14px;
    }
    .cta {
      margin-top: 20px;
      display:flex;
      gap:12px;
      align-items:center;
    }
    .cta .primary {
      background: linear-gradient(90deg, var(--accent), #ff9f1c);
      color: #06121a;
      border: none;
      padding: 14px 20px;
      font-weight: 700;
      border-radius: 10px;

      font-size:16px;
    }
