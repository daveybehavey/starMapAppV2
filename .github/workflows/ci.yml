# PR gate: lint, production build, commerce Playwright smoke (checkout + API regressions).
name: CI

on:
  pull_request:
    paths:
      - "star-map-app-final/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: star-map-app-final

jobs:
  build-and-commerce-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Commerce Playwright smoke
        run: npm run qa:smoke:commerce
