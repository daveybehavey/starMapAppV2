# PR gate: lint, production build, commerce smoke, and browser-backed render/export smoke.
name: CI

on:
  pull_request:
    paths:
      - "star-map-app-final/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: star-map-app-final

jobs:
  # Preserve the branch-protected check name and fail if any component fails,
  # is cancelled, or is skipped. Independent work runs on separate runners.
  build-and-commerce-smoke:
    needs: [static-checks, ui-smoke, build-commerce-validation]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success"
        working-directory: .

  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Validate Playwright smoke manifest
        run: npm run validate:smoke-manifest

      - name: Link integrity audit
        run: npm run qa:links

  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cache browser binaries only; npm ci and OS dependency checks always run.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('star-map-app-final/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI Playwright smoke
        run: npm run qa:smoke:ui

  build-commerce-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          NEXT_PUBLIC_SENTRY_RELEASE: starmapco@${{ github.sha }}
          SENTRY_SOURCEMAPS: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && '1' || '' }}
        run: npm run build

      - name: Check Sentry credentials
        id: sentry-creds
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Sentry release and source maps
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' && steps.sentry-creds.outputs.available == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: starmapco@${{ github.sha }}
        run: |
          npx --yes @sentry/cli@2 releases new "$SENTRY_RELEASE" || echo "Sentry release already exists"
          npx --yes @sentry/cli@2 sourcemaps upload --release "$SENTRY_RELEASE" --url-prefix "~/_next/static" .next/static
          npx --yes @sentry/cli@2 releases finalize "$SENTRY_RELEASE"

      # Cache browser binaries only; npm ci and OS dependency checks always run.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('star-map-app-final/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Commerce Playwright smoke
        run: npm run qa:smoke:commerce

  render-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: render-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report browser-test versions
        run: |
          node --version
          npm --version
          npx playwright --version

      # Cache browser binaries only; npm ci and OS dependency checks always run.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('star-map-app-final/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render Playwright smoke
        run: npm run qa:smoke:render -- --reporter=line,html --trace=retain-on-failure
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload render-smoke artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            star-map-app-final/playwright-report/
            star-map-app-final/test-results/
          if-no-files-found: error
          retention-days: 14
