# PR gate: lint, production build, commerce smoke, and browser-backed render/export smoke.
name: CI

on:
  pull_request:
    paths:
      - "star-map-app-final/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: star-map-app-final

jobs:
  build-and-commerce-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Commerce Playwright smoke
        run: npm run qa:smoke:commerce

  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: render-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report browser-test versions
        run: |
          node --version
          npm --version
          npx playwright --version

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render Playwright smoke
        run: npm run qa:smoke:render

      - name: Upload render-smoke artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            star-map-app-final/playwright-report/
            star-map-app-final/test-results/
          if-no-files-found: ignore
          retention-days: 14
