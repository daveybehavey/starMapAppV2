# Production deploy on Linux (avoids Windows OpenNext flakiness).
# Requires repo secret CLOUDFLARE_API_TOKEN (Workers edit + account read).
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: star-map-app-final

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c5699cbcedce27a6ad755bdeb815f6de
          DEPLOY_SKIP_LOCK: "1"
          DEPLOY_SKIP_COMPETING: "1"
        run: npm run deploy:inner

      - name: Live critical smoke
        run: npm run qa:live-critical
