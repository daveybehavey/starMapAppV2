# Production deploy on Linux (avoids Windows OpenNext flakiness).
# Requires repo secrets CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL (legacy global key pair)
# or CLOUDFLARE_API_TOKEN (scoped token). Values live in local .env.local — never commit.
#
# Triggers:
#   - manual dispatch fallback (branch/tag/SHA ref)
#   - reusable workflow call from the owner-comment bridge (#234) after SHA + main checks
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        description: Immutable commit SHA validated by the owner-comment bridge
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: star-map-app-final

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: c5699cbcedce27a6ad755bdeb815f6de
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          DEPLOY_SKIP_LOCK: "1"
          DEPLOY_SKIP_COMPETING: "1"
        run: npm run deploy:inner

      - name: Live critical smoke
        run: npm run qa:live-critical
