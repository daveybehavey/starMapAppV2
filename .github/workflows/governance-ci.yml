# Governance-only checks for agent operating foundation files.
# Does not deploy, does not contact production, and uses no secrets.
name: Governance CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".cursor/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "docs/AGENT_OPERATING_MODEL.md"
      - ".github/workflows/governance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies (Prettier parser only)
        working-directory: star-map-app-final
        run: npm ci

      - name: Validate governance foundation
        run: |
          cat > /tmp/governance-validate.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";

          const require = createRequire(path.join(process.cwd(), "star-map-app-final/package.json"));
          const prettier = require("prettier");
          const errors = [];
          const fail = (msg) => errors.push(msg);

          // 1) environment.json parses as JSON
          const envPath = ".cursor/environment.json";
          let env;
          try {
            env = JSON.parse(fs.readFileSync(envPath, "utf8"));
            console.log("OK JSON parse:", envPath);
          } catch (e) {
            fail(`${envPath} is not valid JSON: ${e.message}`);
          }

          if (env) {
            if (env.start || env.terminals) {
              fail(`${envPath} must not auto-start services (start/terminals)`);
            }
            const install = String(env.install || "");
            if (/deploy|wrangler|secret|STRIPE|PRINTFUL|CLOUDFLARE_API_TOKEN/i.test(install)) {
              fail(`${envPath} install command looks unsafe: ${install}`);
            }
          }

          // 2 + 3) Markdown / JSON / YAML governance files parse via Prettier
          const parseTargets = [
            ["AGENTS.md", "markdown"],
            ["docs/AGENT_OPERATING_MODEL.md", "markdown"],
            [".github/pull_request_template.md", "markdown"],
            [".cursor/rules/starmapco-agent.mdc", "markdown"],
            [".cursor/environment.json", "json"],
            [".github/ISSUE_TEMPLATE/agent-task.yml", "yaml"],
          ];

          for (const [file, parser] of parseTargets) {
            if (!fs.existsSync(file)) {
              fail(`missing governance file: ${file}`);
              continue;
            }
            const text = fs.readFileSync(file, "utf8");
            try {
              await prettier.format(text, { parser });
              console.log("OK Prettier parse:", file, `(${parser})`);
            } catch (e) {
              fail(`${file} failed ${parser} parse: ${e.message}`);
            }
          }

          // 4) Documented executable npm scripts exist
          const pkg = JSON.parse(fs.readFileSync("star-map-app-final/package.json", "utf8"));
          const documentedScripts = [
            "lint",
            "typecheck",
            "test:unit",
            "build",
            "qa:smoke:commerce",
            "qa:smoke:render",
            "qa:smoke",
            "dev",
            "check:env",
            "test:ui",
            "ci:pr",
          ];
          for (const name of documentedScripts) {
            if (!pkg.scripts?.[name]) {
              fail(`documented npm script missing from package.json: ${name}`);
            } else {
              console.log("OK script exists:", name);
            }
          }

          // 5) Required safety / policy assertions
          const policySources = [
            "AGENTS.md",
            ".cursor/rules/starmapco-agent.mdc",
            "docs/AGENT_OPERATING_MODEL.md",
            ".github/ISSUE_TEMPLATE/agent-task.yml",
            ".github/pull_request_template.md",
          ];
          const policyText = policySources.map((f) => fs.readFileSync(f, "utf8")).join("\n");

          const assertions = [
            {
              name: "no automatic merge",
              test: /no auto-?merge|never automatically[\s\S]{0,80}merge|No automatic merge/i,
            },
            {
              name: "no automatic deployment",
              test: /no automatic deployment|never automatically[\s\S]{0,120}deploy|No automatic deployment/i,
            },
            {
              name: "no production secrets",
              test: /production secrets|never[\s\S]{0,80}production secrets|No production secrets/i,
            },
            {
              name: "high-risk approval before implementation, merge and deployment",
              test: /before implementation[\s\S]{0,120}before merge[\s\S]{0,120}before production deployment/i,
            },
          ];

          for (const a of assertions) {
            if (!a.test.test(policyText)) {
              fail(`missing required policy assertion: ${a.name}`);
            } else {
              console.log("OK policy assertion:", a.name);
            }
          }

          for (const f of ["AGENTS.md", "docs/AGENT_OPERATING_MODEL.md", ".cursor/rules/starmapco-agent.mdc"]) {
            const t = fs.readFileSync(f, "utf8");
            if (!/Instruction precedence/i.test(t)) {
              fail(`${f} missing Instruction precedence section`);
            }
          }

          // 6) Workflow YAML steps (excluding this embedded script) have no deploy/secret usage
          const wfPath = ".github/workflows/governance-ci.yml";
          const wf = fs.readFileSync(wfPath, "utf8");
          const yamlOnly = wf.slice(0, wf.indexOf("Validate governance foundation"));
          if (!/permissions:\s*\n\s*contents:\s*read\b/.test(wf)) {
            fail(`${wfPath} must declare permissions: contents: read`);
          }
          if (/^\s*secrets\s*:/m.test(yamlOnly)) {
            fail(`${wfPath} must not declare secrets`);
          }
          if (/\$\{\{\s*secrets\./.test(yamlOnly)) {
            fail(`${wfPath} must not reference secrets context`);
          }
          if (/\bnpm run deploy\b/i.test(yamlOnly) || /\bdeploy-production\b/i.test(yamlOnly) || /\bwrangler\s+deploy\b/i.test(yamlOnly)) {
            fail(`${wfPath} must not contain deployment commands`);
          }
          console.log("OK workflow self-check: no deploy/secret references in YAML steps");

          if (errors.length) {
            console.error("\nGovernance validation FAILED:");
            for (const e of errors) console.error(" -", e);
            process.exit(1);
          }
          console.log("\nGovernance validation PASSED");
          NODE
          node /tmp/governance-validate.mjs
