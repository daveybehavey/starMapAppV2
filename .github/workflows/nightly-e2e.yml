# Full local Playwright smoke (UI + export + API + checkout + premium rendering).
# Scheduled + manual; does not deploy. Fails fast on regressions missed by PR commerce-only gate.
name: Nightly E2E

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: star-map-app-final

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: star-map-app-final/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full Playwright smoke
        run: npm run qa:smoke -- --reporter=line,html --trace=retain-on-failure
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload nightly Playwright artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            star-map-app-final/playwright-report/
            star-map-app-final/test-results/
          if-no-files-found: error
          retention-days: 14
